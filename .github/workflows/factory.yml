name: factory-tick

on:
  schedule:
    - cron: '0 14 * * 1-5' # 14:00 UTC weekdays; the tick is idempotent, so cadence is a policy knob
  workflow_dispatch: {}

concurrency:
  group: factory
  cancel-in-progress: false

# The tick commits telemetry back to this repo; without this the default
# GITHUB_TOKEN is read-only and the persist step fails after the work is done.
permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      # The tick needs a committed factory.config.json; without one the
      # schedule is a no-op.
      - if: hashFiles('factory.config.json') != ''
        run: npm run factory -- run
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # PAT with repo scope on the target repo; the default GITHUB_TOKEN
          # is scoped to this repo and cannot label/PR the target repo.
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
      # Telemetry lives in the runner unless persisted; commit it back so
      # outcome reconciliation works across ticks.
      #
      # The tick runs for hours on a checkout taken at the start, so main has
      # usually moved by the time we get here and a plain push is rejected as
      # non-fast-forward. runs.jsonl is append-only, so instead of merging we
      # take the rows this tick added and replay them onto whatever main is
      # now. Each attempt starts from a fresh origin/main, so a lost race just
      # retries.
      - name: Persist telemetry
        if: hashFiles('factory.config.json') != ''
        run: |
          if [[ -z "$(git status --porcelain telemetry/ 2>/dev/null)" ]]; then
            exit 0
          fi
          git config user.name "deeptempo-factory"
          git config user.email "deeptempo-factory@users.noreply.github.com"

          base_rows=$(git show HEAD:telemetry/runs.jsonl 2>/dev/null | wc -l)
          tail -n +"$((base_rows + 1))" telemetry/runs.jsonl > "$RUNNER_TEMP/new-rows.jsonl"
          echo "persisting $(wc -l < "$RUNNER_TEMP/new-rows.jsonl") telemetry row(s)"

          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p telemetry
            cat "$RUNNER_TEMP/new-rows.jsonl" >> telemetry/runs.jsonl
            git add -f telemetry/runs.jsonl
            git commit -q -m "telemetry: factory tick $(date -u +%Y-%m-%dT%H:%M)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); main moved again, retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not persist telemetry after 5 attempts"
          exit 1
